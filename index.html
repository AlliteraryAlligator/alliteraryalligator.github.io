<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Test</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
      background: #f5f5f5;
    }
    img {
      max-width: 90%;
      border: 2px solid #333;
      border-radius: 8px;
      margin-top: 20px;
    }
    .status {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>✅ Image loaded successfully</h1>
  <h2>Local image test</h2>
  <img src="ramya-v2.png" alt="Local test image" onerror="this.outerHTML='<p style=color:red>❌ Local image failed to load — check path/filename</p>'">
</body>
</html>
